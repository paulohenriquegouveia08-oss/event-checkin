services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda as migrations e sai. O backend só sobe depois deste terminar com
  # sucesso (ver "depends_on" abaixo) — nunca sobe API apontando pra um
  # schema desatualizado.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      # Este servico tambem roda os seeds, e o de modelos de certificado
      # GRAVA ARQUIVO. Sem o volume e o STORAGE_DIR abaixo, a arte iria
      # para o disco efemero do container e a linha do banco apontaria
      # para um arquivo que o backend nao enxerga — o modelo apareceria
      # cadastrado e o certificado nao geraria.
      STORAGE_DIR: /app/apps/backend/storage
      # `env.ts` valida o ambiente inteiro no import, entao o seed exige
      # estas mesmo sem usar.
      JWT_SECRET: ${JWT_SECRET}
      CERTIFICATE_VALIDATION_BASE_URL: ${CERTIFICATE_VALIDATION_BASE_URL}
    volumes:
      - certificates_storage:/app/apps/backend/storage
    working_dir: /app/apps/backend
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Caminho dentro do container — precisa bater com o volume abaixo,
      # senão os PDFs gerados (certificados/comprovantes) somem a cada
      # rebuild (ver certificate-storage.ts).
      STORAGE_DIR: /app/apps/backend/storage
      CERTIFICATE_VALIDATION_BASE_URL: ${CERTIFICATE_VALIDATION_BASE_URL}
      # E-mail (Resend ou SMTP Gmail). PRECISAM estar aqui: a chave existir no .env da
      # VPS nao basta, o container so enxerga o que esta nesta lista — e
      # sem as credenciais o sistema NAO envia e NAO da erro, so registra no log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Endereco de fallback do botao "Acessar pagina do evento", para
      # evento que nao configurou o proprio site na aba E-mails.
      PRE_COPOL_BASE_URL: ${PRE_COPOL_BASE_URL:-}
      # Endereco publico do proprio backend. O Mercado Pago monta a
      # notification_url da cobranca com este valor — se estiver errado, o
      # pagamento acontece e a notificacao nunca chega.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      # Mercado Pago. Vale o mesmo aviso do RESEND acima: a variavel
      # existir no .env da VPS nao basta, o container so enxerga o que
      # esta nesta lista. Sem MP_ACCESS_TOKEN o cliente entra em modo
      # simulado e NENHUMA cobranca real e' gerada.
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    volumes:
      - certificates_storage:/app/apps/backend/storage
    ports:
      - "${PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Caminho relativo, de propósito. O nginx do próprio admin faz o
        # proxy de /api/ para o backend (ver apps/admin/nginx.conf), então
        # o painel chama a API na MESMA origem por onde foi servido.
        #
        # Antes isto era ${PUBLIC_API_URL}, um endereço absoluto compilado
        # dentro do bundle. Amarrava o painel a um host e uma porta: aberto
        # por qualquer outro endereço, a tela carregava e toda requisição
        # falhava, porque o JavaScript seguia chamando o endereço antigo.
        # Com caminho relativo, funciona de onde quer que seja servido —
        # túnel, domínio novo, rede interna — sem recompilar.
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT}:80"


volumes:
  db_data:
  certificates_storage:
