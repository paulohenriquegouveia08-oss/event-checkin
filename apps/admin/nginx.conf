server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo estático cai no
    # index.html — o React Router assume o roteamento client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A API atendida pela MESMA origem do painel.
    #
    # Antes, o endereço do backend era compilado dentro do bundle
    # (VITE_API_URL), o que amarrava o painel a um host e uma porta
    # específicos: acessá-lo por qualquer outro endereço — um túnel, um
    # domínio novo, a máquina de outra pessoa — fazia a tela abrir e todas
    # as requisições falharem, porque o JavaScript continuava chamando o
    # endereço antigo. E a porta 3000 é bloqueada em rede corporativa.
    #
    # Com o proxy aqui, o painel chama /api/... na própria origem e o nginx
    # entrega ao backend. Passa a funcionar de onde quer que seja servido,
    # sem recompilar.
    #
    # A barra final em proxy_pass é o que remove o /api do caminho:
    # /api/auth/login chega ao backend como /auth/login.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O monitor ao vivo usa SSE (Server-Sent Events): sem desligar o
        # buffer, o nginx segura os eventos e a tela só atualiza no fim.
        proxy_buffering off;
        proxy_read_timeout 24h;
    }
}
